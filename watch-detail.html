    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: var(--font-body);
      font-weight: 300;
      letter-spacing: 0.03em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(14px);
      z-index: 1100;
      border-bottom: 1px solid var(--border);
    }

    .nav-logo img {
      height: 40px;
      width: auto;
    }

    .back-link {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--gold-lt);
    }

    .detail-container {
      margin-top: 100px;
      padding: 2rem;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
.detail-image-wrapper {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 2rem;
  position: relative;
}
 
    .detail-image {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #0a0a0d;
}

.detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.3s ease;
}
    .detail-name {
      font-family: var(--font-display);
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--ivory);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .detail-tag {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: var(--gold);
      color: var(--black);
      padding: 0.4rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .detail-price {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    .detail-desc {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--muted);
      text-align: center;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .detail-specs {
      width: 100%;
      max-width: 500px;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .detail-specs h3 {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      text-align: center;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(37, 37, 48, 0.3);
      font-size: 0.9rem;
    }

    .spec-label {
      color: var(--muted);
    }

    .spec-value {
      color: var(--ivory);
    }

    /* ─── Arrow Buttons ─── */
.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(5, 5, 5, 0.7);
  backdrop-filter: blur(8px);
  color: var(--ivory);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  font-size: 1.8rem;
  cursor: pointer;
  z-index: 10;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  font-weight: 300;
  user-select: none;
}

.gallery-arrow:hover {
  background: var(--gold);
  color: var(--black);
  border-color: var(--gold);
}

.gallery-arrow:disabled {
  opacity: 0.2;
  cursor: not-allowed;
  pointer-events: none;
}

.prev-arrow {
  left: 12px;
}

.next-arrow {
  right: 12px;
}

/* ─── Thumbnail Dots ─── */
.thumbnail-dots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.thumbnail-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 0;
}

.thumbnail-dot:hover {
  background: var(--muted);
}

.thumbnail-dot.active {
  background: var(--gold);
  border-color: var(--gold);
  transform: scale(1.2);
}

/* ─── Small thumbnails below (optional) ─── */
.thumbnail-strip {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.thumbnail-strip img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0.5;
}

.thumbnail-strip img:hover {
  opacity: 0.8;
}

.thumbnail-strip img.active-thumb {
  border-color: var(--gold);
  opacity: 1;
}

    .btn-back {

// ═══════════════════════════════════════════════════
// GALLERY STATE
// ═══════════════════════════════════════════════════
let currentImageIndex = 0;
let currentImages = [];

// ═══════════════════════════════════════════════════
// LOAD WATCH DATA FROM URL
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  const params = new URLSearchParams(window.location.search);
  const watchId = params.get('id');

  if (!watchId) {
    document.getElementById('detailName').textContent = 'Watch not found';
    return;
  }

  const watch = watches.find(w => w.id === watchId);

  if (!watch) {
    document.getElementById('detailName').textContent = 'Watch not found';
    document.getElementById('detailDesc').textContent = 'The watch you are looking for does not exist.';
    return;
  }

  // ─── Store images ──────────────────────────────────
  currentImages = watch.images || [watch.image || 'https://via.placeholder.com/600x600/111/555?text=No+Image'];
  currentImageIndex = 0;

  // ─── Populate the page ────────────────────────────
  document.getElementById('detailName').textContent = watch.name;
  document.getElementById('detailTag').textContent = watch.tag;
  document.getElementById('detailPrice').textContent = watch.price;
  document.getElementById('detailDesc').textContent = watch.desc;

  // ─── Show first image ─────────────────────────────
  updateGallery();

  // ─── Populate specs ──────────────────────────────
  const specsContainer = document.getElementById('specsContainer');
  specsContainer.innerHTML = '';
  watch.specs.forEach(spec => {
    const row = document.createElement('div');
    row.className = 'spec-row';
    row.innerHTML = `
      <span class="spec-label">${spec.label}</span>
      <span class="spec-value">${spec.value}</span>
    `;
    specsContainer.appendChild(row);
  });

  // ─── Update page title ────────────────────────────
  document.title = `${watch.name} — HOUSE OF SWISS`;

  // ─── Update arrows ────────────────────────────────
  updateArrows();
});

// ═══════════════════════════════════════════════════
// GALLERY FUNCTIONS
// ═══════════════════════════════════════════════════
function updateGallery() {
  const img = document.getElementById('detailImg');
  if (img && currentImages.length > 0) {
    img.src = currentImages[currentImageIndex];
    img.alt = document.getElementById('detailName').textContent;
  }
  updateDots();
  updateArrows();
}

function updateDots() {
  const dotsContainer = document.getElementById('thumbnailDots');
  if (!dotsContainer) return;

  dotsContainer.innerHTML = '';
  
  if (currentImages.length <= 1) {
    dotsContainer.style.display = 'none';
    return;
  }

  dotsContainer.style.display = 'flex';

  currentImages.forEach((_, index) => {
    const dot = document.createElement('button');
    dot.className = `thumbnail-dot${index === currentImageIndex ? ' active' : ''}`;
    dot.setAttribute('data-index', index);
    dot.addEventListener('click', () => {
      currentImageIndex = index;
      updateGallery();
    });
    dotsContainer.appendChild(dot);
  });
}

function updateArrows() {
  const prevArrow = document.getElementById('prevArrow');
  const nextArrow = document.getElementById('nextArrow');

  if (!prevArrow || !nextArrow) return;

  const hasMultiple = currentImages.length > 1;
  
  prevArrow.style.display = hasMultiple ? 'flex' : 'none';
  nextArrow.style.display = hasMultiple ? 'flex' : 'none';
  
  prevArrow.disabled = currentImageIndex === 0;
  nextArrow.disabled = currentImageIndex === currentImages.length - 1;
}

function prevImage() {
  if (currentImageIndex > 0) {
    currentImageIndex--;
    updateGallery();
  }
}

function nextImage() {
  if (currentImageIndex < currentImages.length - 1) {
    currentImageIndex++;
    updateGallery();
  }
}

// ═══════════════════════════════════════════════════
// ATTACH EVENT LISTENERS
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('prevArrow')?.addEventListener('click', prevImage);
  document.getElementById('nextArrow')?.addEventListener('click', nextImage);

  // Keyboard support
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'ArrowRight') nextImage();
  });

</script>
