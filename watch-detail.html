      --font-display: 'Cinzel', serif;

      --font-body: 'Raleway', sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: var(--font-body);
      font-weight: 300;
      letter-spacing: 0.03em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      background: rgba(5,5,5,0.85);
      backdrop-filter: blur(14px);
      z-index: 1100;
      border-bottom: 1px solid var(--border);
    }

    .nav-logo img {
      height: 40px;
      width: auto;
    }

    .back-link {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--gold-lt);
    }

    .detail-container {
      margin-top: 100px;
      padding: 2rem;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .detail-image {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0a0a0d;
      margin-bottom: 2rem;
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-name {
      font-family: var(--font-display);
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: var(--ivory);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .detail-tag {
      display: inline-block;
      font-family: var(--font-display);
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: var(--gold);
      color: var(--black);
      padding: 0.4rem 1.2rem;
      margin-bottom: 1.5rem;
    }

    .detail-price {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.18em;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    .detail-desc {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--muted);
      text-align: center;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .detail-specs {
      width: 100%;
      max-width: 500px;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .detail-specs h3 {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      text-align: center;
    }

    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(37, 37, 48, 0.3);
      font-size: 0.9rem;
    }

    .spec-label {
      color: var(--muted);
    }

    .spec-value {
      color: var(--ivory);
    }

    .btn-back {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: var(--gold);
      color: var(--black);
      padding: 0.9rem 2.5rem;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 2rem;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover {
      background: var(--gold-lt);
    }

    footer {
      background: var(--deep);
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      margin-top: auto;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .detail-name { font-size: 1.8rem; }
      .detail-container { padding: 1rem; margin-top: 80px; }
    }

</head>

      return;
    }

    const watch = watches.find(w => w.id === watchId);

    if (!watch) {
      document.getElementById('detailName').textContent = 'Watch not found';
      document.getElementById('detailDesc').textContent = 'The watch you are looking for does not exist.';
      return;
    }

    // Populate the page
    document.getElementById('detailImg').src = watch.image;
    document.getElementById('detailImg').alt = watch.name;
    document.getElementById('detailName').textContent = watch.name;
    document.getElementById('detailTag').textContent = watch.tag;
    document.getElementById('detailPrice').textContent = watch.price;
    document.getElementById('detailDesc').textContent = watch.desc;

    // Populate specs
    const specsContainer = document.getElementById('specsContainer');
    specsContainer.innerHTML = '';
    watch.specs.forEach(spec => {
      const row = document.createElement('div');
      row.className = 'spec-row';
      row.innerHTML = `
        <span class="spec-label">${spec.label}</span>
        <span class="spec-value">${spec.value}</span>
      `;
      specsContainer.appendChild(row);
    });

    // Update page title
    document.title = `${watch.name} — HOUSE OF SWISS`;
  });
</script>

</body>
</html>
